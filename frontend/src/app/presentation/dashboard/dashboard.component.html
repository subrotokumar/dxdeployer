        <li class="mr-4 font-semibold">{{myInfo()?.data?.username}} 's</li>
        <li class="mr-4">
            <brn-select class="inline-block border-none max-h-[40px] dark" placeholder="My Project">
                <hlm-select-trigger class="h-10">
                    <hlm-select-value />
                </hlm-select-trigger>
                <hlm-select-content class="w-56">
                    <hlm-option value="Refresh">Refresh</hlm-option>
                    <hlm-option value="Settings">Settings</hlm-option>

                </hlm-select-content>
            </brn-select>
        </li>

        <li class="mr-4 text-gray-400">
            <button class="hover:bg-gray-700 px-2 py-1 border rounded-md hover:text-gray-200">Feedback</button>
        </li>
        <li class="mr-4 text-gray-400 hover:text-gray-200">Changelog</li>
        <li class="mr-4 text-gray-400 hover:text-gray-200">Help</li>
        <li class="mr-4 text-gray-400 hover:text-gray-200">Docs</li>
        <li class="mr-4 text-gray-400 hover:text-gray-200">Profile</li>
        <!-- Bell Icon -->
        <notification/>
        
        <!-- ProfileIcon -->
        <profile-icon/>

<div class="box-border">
    <hlm-tabs tab='account' class='bg-transparent'>
        <hlm-tabs-list class='flex justify-start bg-[#0e0e0e]' aria-label='Project Section'>
            <button class="hover:text-gray-300" hlmTabsTrigger='account'>Account</button>
            <button class="hover:text-gray-300" hlmTabsTrigger='integration'>Integration</button>
            <button class="hover:text-gray-300" hlmTabsTrigger='acitvity'>Acitvity</button>
            <button class="hover:text-gray-300" hlmTabsTrigger='domains'>Domains</button>
            <button class="hover:text-gray-300" hlmTabsTrigger='usage'>Usage</button>
            <button class="hover:text-gray-300" hlmTabsTrigger='monitoring'>Monitoring</button>
            <button class="hover:text-gray-300" hlmTabsTrigger='settings'>Settings</button>
        </hlm-tabs-list>
        <div hlmTabsContent='account'>
            <overview/>
        </div>
        <div hlmTabsContent='integration'>
            Change your password here
        </div>
        <div hlmTabsContent='acitvity'>
            Acitvity
        </div>
        <div hlmTabsContent='domains'>

        </div>
        <div hlmTabsContent='usage'>
            Usage
        </div>
        <div hlmTabsContent='monitoring'>

        </div>
