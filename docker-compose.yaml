services:
  postgres:
    container_name: dxd_pg_sql
    image: docker.io/postgres:alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - microservices-net
    restart: unless-stopped

  # pgadmin:
  #   container_name: dxd_pgadmin
  #   image: docker.io/dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
  #     PGADMIN_CONFIG_SERVER_MODE: "False"
  #   volumes:
  #     - pgadmin:/var/lib/pgadmin
  #   ports:
  #     - 5050:80
  #   networks:
  #     - microservices-net
  #   restart: unless-stopped

  mongodb:
    image: docker.io/mongo
    container_name: dxd_mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

  # mongo-express:
  #   image: docker.io/mongo-express
  #   container_name: mongo_express
  #   restart: always
  #   ports:
  #     - 8081:8081
  #   environment:
  #     - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
  #     - ME_CONFIG_MONGODB_ADMINPASSWORD=password
  #     - ME_CONFIG_MONGODB_SERVER=mongodb

  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:latest
    container_name: zooker
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - microservices-net

  kafka:
    image: docker.io/confluentinc/cp-kafka:latest
    container_name: dxd_kafka
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSCATION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    networks:
      - microservices-net

  # config:
  #   container_name: localhost/config-server
  #   ports:
  #     - 8888:8888
  #   networks:
  #     - microservices-net
  
  # discovery:
  #   container_name: localhost/discovery-server
  #   ports:
  #     - 8761:8761
  #   networks:
  #     - microservices-net
  #   depends_on:
  #     - config
  
  mail-dev:
    container_name: dxd_mail_dev
    image: docker.io/maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

  # zipkin:
  #   container_name: zipkin
  #   image: docker.io/openzipkin/zipkin
  #   ports:
  #     - 9411:9411
  #   networks:
  #     - microservices-net

  # nginx:
  #   image: docker.io/nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./conf/nginx.conf:/etc/nginx/nginx.conf
  #   networks:
  #     - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongo:
