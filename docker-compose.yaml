services:
  postgres:
    container_name: dxd_pg_sql
    image: docker.io/postgres:alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - microservices-net
    restart: unless-stopped

  mongo:
    image: docker.io/mongo
    container_name: dxd_mongodb
    ports:
      - 27000:27017
    volumes:
      - mongo:/data
    networks:
      - microservices-net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:latest
    container_name: zooker
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - microservices-net

  kafka:
    image: docker.io/confluentinc/cp-kafka:latest
    container_name: dxd_kafka
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSCATION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    networks:
      - microservices-net
  
  mail-dev:
    container_name: dxd_mail_dev
    image: docker.io/maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

  zipkin:
    container_name: zipkin
    image: docker.io/openzipkin/zipkin
    ports:
      - 9411:9411
    networks:
      - microservices-net

  dbgate:
    image: docker.io/dbgate/dbgate
    restart: always
    ports:
      - 8000:3000
    volumes:
      - dbgate-data:/root/.dbgate
    networks:
      - microservices-net
    environment:
      CONNECTIONS: con1,con2

      LABEL_con1: Postgres
      SERVER_con1: postgres
      USER_con1: admin
      PASSWORD_con1: password
      PORT_con1: 5432
      ENGINE_con1: postgres@dbgate-plugin-postgres

      LABEL_con2: MongoDB
      URL_con2: mongodb://admin:password@mongo:27000
      ENGINE_con2: mongo@dbgate-plugin-mongo

  # nginx:
  #   image: docker.io/nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./conf/nginx.conf:/etc/nginx/nginx.conf
  #   networks:
  #     - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongo:
  dbgate-data:
    driver: local
